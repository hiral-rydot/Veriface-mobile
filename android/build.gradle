// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // buildToolsVersion = "29.0.2"
        // minSdkVersion = 23
        // compileSdkVersion = 33
        // targetSdkVersion = 33
        // playServicesVersion = "17.0.0" 
        // supportLibVersion = "28.0.0"
        // androidMapsUtilsVersion = "2.2.0"
        // if (System.properties['os.arch'] == "aarch64") {
        //     // For M1 Users we need to use the NDK 24 which added support for aarch64
        //     ndkVersion = "24.0.8215888"
        // } else {
        //     // Otherwise we default to the side-by-side NDK version from AGP.
        //     ndkVersion = "21.4.7075529"
        // }

        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34

        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:7.3.1')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.gms:google-services:4.3.3'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }

        google()
        mavenCentral()
        jcenter()
        maven { url 'https://www.jitpack.io' }
    }

    // React Native 0.71+ no longer ships its Android binaries inside node_modules.
    // They are published to Maven Central as react-android / hermes-android, so map the
    // legacy coordinates (used by this app and older libraries) to the installed RN version.
    def reactNativeVersion = new groovy.json.JsonSlurper()
            .parse(file("$rootDir/../node_modules/react-native/package.json")).version
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute(module("com.facebook.react:react-native"))
                    .using(module("com.facebook.react:react-android:${reactNativeVersion}"))
            substitute(module("com.facebook.react:hermes-engine"))
                    .using(module("com.facebook.react:hermes-android:${reactNativeVersion}"))
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.6.0'
    }
}